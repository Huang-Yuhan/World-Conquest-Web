name: CI and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Map data tests
        run: npm test
      - name: Build Vite production assets
        run: npm run build
      - name: Install browser for smoke test
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test (production preview)
        run: npm run test:browser
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live Pages resources
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for path in "/" "/scenarios/asteria-1936.json" "/maps/asteria/map.json"; do
            echo "Checking ${base}${path}"
            curl --fail --location --silent --show-error \
              --retry 8 --retry-delay 3 --retry-all-errors --max-time 15 \
              "${base}${path}" -o "/tmp/pages-$(echo "${path}" | tr '/' '_')"
          done
          grep -q 'World-Conquest-Web/assets/' "/tmp/pages-_"
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('/tmp/pages-_maps_asteria_map.json'));if(m.id!=='asteria')process.exit(1)"
